node:
  identity:
    persistent: true
  discovery:
    nostr:
      enabled: true
      advertise: true
      advert_relays:
        - "wss://relay.damus.io"
        - "wss://nos.lol"
        - "wss://offchain.pub"
        - "wss://temp.iris.to"
      dm_relays:
        - "wss://relay.damus.io"
        - "wss://nos.lol"
        - "wss://offchain.pub"
        - "wss://temp.iris.to"

tun:
  enabled: true
  name: fips0
  mtu: 1280

dns:
  enabled: true

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    mtu: 1472
    advertise_on_nostr: true
    public: true
    external_addr: "80.78.18.182:2121"   # uncomment and set your fixed public IP to skip STUN

  tcp:
    bind_addr: "0.0.0.0:2121"
    advertise_on_nostr: true
    external_addr: "80.78.18.182:2121"   # uncomment and set your fixed public IP to skip STUN

